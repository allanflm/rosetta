name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes
        run: pytest tests/ -v

      - name: Conferir que nenhum módulo faz escrita no catálogo
        # Rede de segurança em cima da trava de seguranca.py: se alguém adicionar
        # um saveAsTable/CREATE em src/, o CI falha antes do merge.
        run: |
          if grep -rInE "saveAsTable|\.write\.|createOrReplaceTempView" src/; then
            echo "❌ Encontrada operação de escrita em src/ — o projeto é somente leitura."
            exit 1
          fi
          echo "✅ Nenhuma operação de escrita encontrada em src/."
